<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex2</title>
    <script src="controller.js" defer></script>
    <style>
        body {
            background-color: #f4f6f9;
            font-family: system-ui, -apple-system, sans-serif;
          
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { 
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
       
        .card-container {
            width: 420px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }
       
        .form-row {
            margin-bottom: 15px;
            width: 100%;
        }
        .form-row label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #444;
            font-size: 14px;
        }
        .form-row input, .form-row select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        #btn {
            background-color: #007bff;
            color: white;
            width: 100%;
            height: 42px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            margin-top: 10px;
        }
        #btn:hover {
            background-color: #0056b3;
        }
        #message {
            color:#007bff;
            font-family: system-ui, sans-serif;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
        .footer{
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: lightgray;
            padding-top: 10px;
            border-top: 1px solid lightgray;
        }
    </style>
</head>
<body>

    <h1>Credit card payment info</h1>
    
  
    <div class="card-container">
        <form>
            <div class="form-row">
                <label>Select card type:</label>
                <select>
                    <option>visa</option>
                    <option>mastercard</option>
                    <option>american express</option>
                </select>
            </div>

            <div class="form-row">
                <label>credit card nb:</label>
                <input type="text" id="card" placeholder="5xxxx-xxxx-xxxx">
                <span id="carderror" style="color: red; font-size: 12px;"></span>
            </div>

            <div class="form-row">
                <label>expiry date:</label>
                <input type="text" id="exp" placeholder="MM-YY">
                <span id="dateerror" style="color: red; font-size: 12px;"></span>
            </div>

            <div class="form-row">
                <label>verification code:</label>
                <input type="text" id="code" placeholder="xxx">
                <span id="errorcode" style="color: red; font-size: 12px;"></span>
            </div>

            <div class="form-row">
                <label>first name:</label>
                <input type="text" id="fname">
                <span id="ferror" style="color: red; font-size: 12px;"></span>
            </div>

            <div class="form-row">
                <label>last name:</label>
                <input type="text" id="lname">
                <span id="lerror" style="color: red; font-size: 12px;"></span>
            </div>

            <button id="btn">confirm</button>
            <div id="message"></div>
            <div class="footer">
                &copy; 2026 secure payment system.
            </div>
        </form>
    
    </div>

</body>
</html>
